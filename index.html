<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="lead management, calling app, tally, demo, TSS, whatsapp messages, CRM">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%236366f1'/><stop offset='100%' stop-color='%238b5cf6'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M25 28a6 6 0 016-6h3.3a4 4 0 013.8 2.8l2 6a4 4 0 01-1 4.2l-2.5 3a32 32 0 0016 16l3-2.5a4 4 0 014.2-1l6 2a4 4 0 012.8 3.8v3.3a6 6 0 01-6 6 45 45 0 01-36-45 6 6 0 016-6z' fill='white'/></svg>">
    <title>Kryzo CRM - Lead Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50">
    <!-- Mobile Menu Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-slate-200 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <div class="h-16 flex items-center px-5 border-b border-slate-200">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-lg">Kryzo CRM</h1>
                    <p class="text-xs text-slate-500">Lead Manager</p>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden ml-auto p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <nav id="sidebarNav" class="flex-1 overflow-y-auto py-4 px-3"></nav>
    </aside>

    <!-- Main Content -->
    <div class="lg:ml-64 min-h-screen">
        <!-- Top Bar -->
        <header class="h-16 bg-white border-b border-slate-200 sticky top-0 z-30 flex items-center px-4 lg:px-6 gap-4">
            <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div class="flex-1 min-w-0">
                <h2 id="pageTitle" class="font-semibold text-slate-800 text-lg truncate">Dashboard</h2>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="navigateTo('follow-ups')" class="relative p-2 text-slate-600 hover:bg-slate-100 rounded-lg" title="Follow-ups">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="fuBadge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                </button>
                <button onclick="navigateTo('settings')" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <main id="pageContent" class="p-4 lg:p-6 max-w-7xl mx-auto"></main>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>

    <!-- Modal Container -->
    <div id="modalContainer" class="fixed inset-0 z-[90] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/50" onclick="closeModal()"></div>
        <div id="modalContent" class="relative bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"></div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirmContainer" class="fixed inset-0 z-[95] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/50"></div>
        <div class="relative bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h3 id="confirmTitle" class="font-semibold text-lg text-slate-800 mb-2">Confirm</h3>
            <p id="confirmMessage" class="text-slate-600 mb-6">Are you sure?</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeConfirm()" class="px-4 py-2 text-slate-700 hover:bg-slate-100 rounded-lg font-medium transition">Cancel</button>
                <button id="confirmBtn" class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded-lg font-medium transition">Confirm</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/pages2.js"></script>
    <script src="js/pages3.js"></script>
    <script src="js/pages4.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const backendReady = await Storage.init();
            if (!backendReady) toast('SQL backend unavailable. Using browser storage.', 'warning');
            window.addEventListener('callflow:sync-error', () => toast('Database save failed. Your browser copy is still available.', 'error'));
            renderSidebar();
            navigateTo('dashboard');
            updateFUBadge();
        });
    </script>
</body>
</html>
